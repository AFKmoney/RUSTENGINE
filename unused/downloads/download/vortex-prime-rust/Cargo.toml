[package]
name = "vortex-prime"
version = "4.0.0"
edition = "2021"
description = "VORTEX PRIME — Cryptanalytic solver for Bitcoin Puzzle #135"

[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
clap = { version = "4", features = ["derive"] }
rayon = "1.8"
cudarc = { version = "0.9", optional = true }
log = "0.4"
env_logger = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["cpu"]
cuda = ["cudarc"]
cpu = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
target-cpu = "native"

[profile.gpu]
inherits = "release"
