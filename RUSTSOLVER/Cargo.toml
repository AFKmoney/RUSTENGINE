[package]
name = "rustsolver"
version = "2.0.0"
edition = "2021"
description = "VORTEX PRIME RUSTSOLVER v2 — Optimized LBE with integer d-LLL for Bitcoin Puzzle P135"

[dependencies]
rayon = "1.10"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
clap = { version = "4", features = ["derive"] }

[features]
default = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
target-cpu = "native"
panic = "abort"

[profile.dev-opt]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 4
