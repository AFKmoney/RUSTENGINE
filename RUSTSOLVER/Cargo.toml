[package]
name = "rustsolver"
version = "11.0.0"
edition = "2021"
description = "PRISM VORTEX RUSTSOLVER v11 — GLV-Expanded DPs + Batch Affine + Oracle for Bitcoin Puzzle P135"

[dependencies]
rayon = "1.10"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
clap = { version = "4", features = ["derive"] }

[features]
default = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
