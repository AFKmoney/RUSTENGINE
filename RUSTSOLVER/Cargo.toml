[package]
name = "rustsolver"
version = "15.0.0"
edition = "2021"
description = "PRISM VORTEX v15 TITAN — 15-Layer Solver: 2D BSGS+GLV+Extended Oracle+Tag BSGS for P135"

[dependencies]
rayon = "1.10"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
clap = { version = "4", features = ["derive"] }

[features]
default = []
cuda = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
