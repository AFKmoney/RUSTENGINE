[package]
name = "titan-v16"
version = "16.3.0"
edition = "2021"
description = "TITAN V16.3 — 9-Layer Hyperstack ECDLP Solver for Bitcoin Puzzle #135 (FIXED)"

[dependencies]
rayon = "1.10"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.12", features = ["cuda-12050"], optional = true }

[features]
default = ["cpu"]
cpu = []
cuda = ["cudarc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
target-cpu = "native"
