[package]
name = "vortex-gpu"
version = "8.0.0"
edition = "2021"
description = "VORTEX PRIME v8 — GPU-accelerated ECDLP solver with CUDA kangaroo + GLV √6"

[dependencies]
rayon = "1.10"
hex = "0.4"
sha2 = "0.10"
ripemd = "0.1"
num-bigint = "0.4"
num-traits = "0.2"
clap = { version = "4", features = ["derive"] }
cudarc = { version = "0.12", features = ["cuda-12050"], optional = true }

[features]
default = ["cpu"]
cpu = []
cuda = ["cudarc"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
